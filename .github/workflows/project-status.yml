name: Project status

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  sync:
    if: contains(fromJSON('["needs-triage","needs-info","ready-for-agent","ready-for-human"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - name: Move the issue's card to the label's column
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          LABEL: ${{ github.event.label.name }}
          ISSUE: ${{ github.event.issue.node_id }}
        # ponytail: IDs hardcoded; they survive renames, re-read them if the board is rebuilt.
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PROJECT_TOKEN is not set; the board was not updated."
            exit 0
          fi
          case "$LABEL" in
            needs-triage | needs-info) option=f75ad846 ;;
            ready-for-agent) option=30669849 ;;
            ready-for-human) option=d24d0054 ;;
          esac
          item=$(gh api graphql -f p=PVT_kwHOAARnVc4BmowK -f c="$ISSUE" --jq .data.addProjectV2ItemById.item.id \
            -f query='mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}')
          gh api graphql -f p=PVT_kwHOAARnVc4BmowK -f i="$item" -f f=PVTSSF_lAHOAARnVc4BmowKzhlQ8U4 -f o="$option" \
            -f query='mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}'
