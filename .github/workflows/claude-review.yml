name: Claude Review

# main is protected with zero required approvals — a solo repo has no second reader.
# This is that reader. It comments; it never approves and never merges.
#
# IT WILL NOT RUN ON A PR THAT EDITS THIS FILE. claude-code-action refuses to execute unless the
# workflow file is byte-identical to the copy on the default branch — otherwise a PR could rewrite
# the workflow and walk off with the token. On a mismatch it logs a warning and exits SUCCESS, so
# the check goes green having reviewed nothing. Every PR up to and including the one that added
# this file changed a workflow, so none of them were ever reviewed; that is expected, not a bug.
# Look for "Exiting due to workflow validation skip" in the job log before debugging anything else.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Fork PRs get no secrets on `pull_request`, so the action would fail with an empty key.
    # Skip them explicitly rather than fail loudly on every outside contribution.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # The `secrets` context cannot be used in a job-level `if`, but it can be used in job-level
    # `env` — so the guard lives on the steps. Without this the job goes red on every PR until
    # the token is set, and a check that is always red is a check nobody reads.
    #
    # CLAUDE_CODE_OAUTH_TOKEN, not ANTHROPIC_API_KEY: /install-github-app wired this repo to a
    # Claude subscription rather than API billing. The guard is why the mismatch was survivable —
    # it skipped rather than failing — but it also made the workflow silently inert, so the guard
    # must name the SAME secret the action consumes or it hides exactly what it was meant to show.
    env:
      HAS_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set — skipping review. Run /install-github-app in Claude Code."

      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.

            Read CLAUDE.md first — it holds the invariants below and the reasoning behind
            them. A comment's home is decided by reader distance, never by its length: it
            stays if whoever edits that function needs the fact now, with the number at
            the reader's eye — one line is the target, not a cap, so do not flag a
            three-line mechanism that cannot be said in one. It moves to
            `docs/decisions/` or `docs/architecture.md` if the fact is only needed
            when changing the design, and it dies only if it restates the code or a
            fact another comment already carries.
            JSDoc ANNOTATIONS are exempt — `@param` restates the code by design and
            `tsc` reads it — but prose inside a JSDoc block is prose and is governed,
            which is where several load-bearing facts actually live.
            Treat a deleted measurement as a change that needs justifying; treat a comment
            reduced to a bare `// see docs/...` — a pointer carrying no fact and naming no
            ceiling — as a finding; and when a block moves, check that references pointing
            AT it (CLAUDE.md, docs/, README.md, this file, other modules) moved with it.
            docs/decisions/2026-08-23-comment-reader-distance.md is the rule.

            Two checks on the prose itself, because a fix that adds prose buys new
            findings and three rounds of that is how #87 shipped one measurement written
            four ways:

            - **A measurement appears in exactly ONE place; everything else points at
              it.** Flag the same figure restated in a second comment, a test comment, the
              CHANGELOG or a doc — that copy is where the drift comes from, not the
              original. 142 vs 143 unique prompts and 3227 vs 3862 turns both got through
              as copies nobody updated together. A figure with no date is the same defect.
            - **Flag a comment that restates what a named test already pins.** If
              `CLI gate refuses a question that matches nothing` exists as a test, the
              block above the code saying the same thing is the copy, not the record.

            Weight the review toward the things that break silently here. In rough order:

            1. PRIVACY. This is a public repo and the vault is private. Flag any real note
               content, personal or colleague names, internal hostnames, account IDs, or
               generated eval case sets (`eval-cases-*.jsonl`) that appear in the diff or
               in a test fixture. This is the one finding that must never be soft-pedalled.
            2. State written inside the plugin directory instead of `$CLAUDE_MEMORY_HOME`.
               Every release installs into its own version-pinned cache dir, so anything
               put there is both lost on update and duplicated per version — indexes and
               722 MB of model weights included.
            3. An absolute install path anywhere. bash resolves via `BASH_SOURCE` and node via
               `import.meta.url`. `${CLAUDE_PLUGIN_ROOT}` is only reliable inside hooks.json
               command strings.
            4. A hook that can block, hang, or fail a session. Hooks degrade to a no-op when
               a dependency is missing; `validate-note.sh` warns and never blocks; heavy
               hooks detach, debounce, and guard against recursing into themselves via a
               `*_CHILD` variable.
               Hooks log what they did through `logHook()`, over `appendJsonl()` in
               `hooks/lib/hook-io.mjs` — the ONLY JSONL appender in the repo. Flag a
               second appender, a log write that can throw or block a hook, a size cap
               added to what dated filenames already rotate, a retention policy for
               `logs/` that lives anywhere but `logRetentionDays()` + `pruneDatedLogs()`
               or that needs a human to run a command, and any hook timeout
               written down outside `hooks/hooks.json` (the reader parses the manifest
               at run time so the two cannot drift). `memory-recall` deliberately logs
               NOTHING when it is disarmed — an inert feature must not cost every
               prompt an append — so that is not a missing log line. A `reason:` string
               that an outcome mapper compares against is a shared constant, never a
               literal copied into the mapper — the copy drifts silently and its test
               stays green. A gate that detaches decides its outcome on `detach()`'s
               pid: `spawned` for a run that never started is the failure this log
               exists to end. Cost and size fields on those lines are optional and are
               OMITTED when not measured, never written as zero; flag an estimate
               printed without being labelled one, and any attempt to estimate the
               distiller's cost from transcript length (its bill is near-fixed cache
               overhead, measured, not proportional to input).
            4b. Claude Code's auto memory loads `MEMORY.md` — the file our L1 index
               IS — and keeps only its first 200 lines or 25 KB, reporting nothing
               when it drops the rest. That cap is ours to report: it lives once, as
               `AUTO_MEMORY_CAP` in `hooks/lib/memory-link-lint.mjs`, read by the
               SessionStart lint and by `/memory:doctor`. Flag the number copied
               anywhere else, a report that names OTHER projects' slugs (that report
               is pasted into issues), and any code that TRIMS the MOC — reporting
               is the bound, trimming is a human act.
            5. Config resolution. The order is env, then `$CLAUDE_MEMORY_HOME/config.json`,
               then the built-in default, and it must be read WHEN THE HOOK RUNS — a value
               written to `settings.json`'s `env` block mid-session never reaches that
               session's hooks. `CLAUDE_MEMORY_HOME` is the one exception: it relocates the
               config file itself, so it can only be an env var.
               **`hooks/lib/paths.mjs` is the single implementation.** `vault-env.sh`
               resolves NOTHING — it `eval`s one `node scripts/env.mjs` call — so flag any
               resolution logic re-added in shell, and any second reader of `config.json`.
               Because those values are `eval`ed, `shellQuote()` in
               `hooks/lib/env-shell.mjs` is a correctness boundary: a vault path containing
               a `$`, a backtick or a quote is an injection without it.
            6. Retrieval changes with no numbers. No recall or MRR figure lands without a
               case-set run behind it, and any figure quoted must name its case set AND its
               kind — `tuning` may be fitted to, `held-out` may not, and the kind is read off
               the resolved filename, never asserted by a flag. Flag a held-out figure quoted
               without the set's frozen sha256, a `--kind` that overrides what an explicit
               `--cases` path says, and a gate that reports a failure instead of exiting
               non-zero. The gate fails closed: a case that could not be scored at all blocks
               the run rather than being averaged into the misses. Flag
               per-model assumptions that were only checked on one model — pooling, chunk
               size, query/doc prefixes, batch size and the `dupeMin`/`clusterMin`
               thresholds do not transfer, and getting them wrong degrades ranking
               silently rather than erroring. A threshold copied between model profiles is
               a defect even when every test passes: bge-m3 carried e5-multi's 0.95 and so
               reported zero duplicates on a vault holding sixteen.
               There is ONE duplicate predicate (`dupeScore`/`bestDupe`, raw cosine over
               CARD chunks, same layer, `>= PROFILE.dupeMin`) and both the distiller's
               write-time reconcile and `--dupes` must call it — a writer and an audit
               scoring duplicates differently is how an arm catching 0 of 25 survived five
               days of evidence. Flag any second definition, and flag gating on
               `searchIn()`'s score, which is RRF-fused with BM25 and is `0` for a
               keyword-only hit. A dedup change quotes caught/total WITH the false count
               beside it, from `--dupe-eval`, and a measurement taken only on the pairs the
               previous arm missed is the wrong distribution.
            7. Non-trivial logic with no test. Tests are `*.test.mjs` files beside the
               module they test, run by `node --test`; there is no framework. Every top-level
               hook/script is a thin entry over a `lib/` module, so logic belongs in `lib/`
               where it can be imported and tested — flag new logic added to an entry point.
               A `lib/` module must import without side effects, and `node:test` must never be
               imported outside a `*.test.mjs` (it prints its report to stdout, which hooks
               use). Also flag a test that can pass while verifying nothing.
               Types are JSDoc checked by `tsc --noEmit` with `checkJs` + `strict`; flag a
               `@ts-ignore` or `@ts-nocheck` (neither is used in the tree), a `@ts-expect-error`
               with no reason, and an `any` that hides a shape the code actually relies on.
            8. A user-visible change with no `## [Unreleased]` entry in CHANGELOG.md, since
               that section becomes the release notes verbatim.
            9. Portability: bash + POSIX (BSD sed on macOS has no `\|`, so `sed -E`) and
               Node >= 22.5. There is deliberately NO Python — flag any reintroduction of a
               second runtime, and note that porting between the two is not mechanical
               (JS `\w` is ASCII-only; `toISOString()` is UTC where `date.today()` is local).

            10. Install weight. Every dependency ships into a user's version-pinned plugin
                cache, so a new one in `package.json` needs justifying, and `devDependencies`
                are not an escape hatch (Claude Code's `npm ci` installs them). `sharp` and
                `onnxruntime-web` are replaced by stubs after install — flag any code that
                calls into them, and any change to `scripts/slim-install.mjs` that could
                delete a path this platform loads from.

            Also apply ordinary judgement — correctness, races, error handling, and
            over-engineering. This codebase prefers the stdlib and the shortest thing that
            works; an abstraction with one caller is a finding.

            Formatting is not a finding: prettier owns it and CI checks it. Do not comment on
            line length, quoting, indentation or trailing commas.

            Be specific and short. Quote the line, say what breaks, say what to do instead.
            If the PR is clean, say so in one or two lines — do not manufacture findings,
            and do not restate what the diff already shows. Prefix anything you are not
            certain of with "possible:" so it reads as a question, not a defect.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            for line-specific findings and `gh pr comment` for the summary.
            Post GitHub comments only — do not return the review as a message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
