name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor `engines` promises (node:sqlite); 24 is what people actually run.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check every shell hook and script
        run: for f in hooks/*.sh hooks/lib/*.sh scripts/*.sh; do bash -n "$f"; done


      # A synthetic vault, never a real one. memory-semantic's self-test asserts against real
      # notes on purpose and hard-fails when it finds none — an empty run must not read as a pass.
      - name: Build a synthetic vault
        run: node scripts/memory-synth-vault.mjs --out "$RUNNER_TEMP/vault" --notes 60 --seed 7

      - name: Self-tests
        env:
          CLAUDE_VAULT: ${{ runner.temp }}/vault
          CLAUDE_MEMORY_HOME: ${{ runner.temp }}/memory-home
        run: |
          node scripts/memory-semantic.mjs --selftest
          node scripts/memory-eval.mjs --selftest
          node scripts/memory-synth-vault.mjs --selftest
          node scripts/memory-audit-checks.mjs --selftest
          node hooks/distill-session.mjs --selftest
          node hooks/validate-note.mjs --selftest
          node hooks/insights-surface.mjs --selftest
          node hooks/memory-link-lint.mjs --selftest
          node hooks/lib/paths.mjs --selftest

      # There is no Python left. Fail if any creeps back in — the whole point of the port was
      # that a second runtime is a second thing to be the wrong version on someone's machine.
      # Matches real dependencies only (a .py file, or a shell hook shelling out to python),
      # not prose: the port's own comments explain why python went away.
      # No \b in the pattern: git grep -E is POSIX ERE, where \b is undefined — it matched
      # NOTHING rather than erroring, so this half of the check was dead on arrival and the
      # step still passed. Verified against a planted .py and a planted .sh; both are caught.
      - name: No Python dependency
        run: |
          bad=$( { git ls-files '*.py'; git grep -l python -- '*.sh'; } | sort -u )
          if [ -n "$bad" ]; then
            echo "::error::a Python dependency reappeared in: $bad"; exit 1
          fi
          echo "no python dependency"

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pure bash, so it lives here rather than in the Node matrix, where it would run twice for
      # no reason. The release version is derived from commit shape; a wrong branch ships a wrong
      # number, and nothing downstream would notice.
      - name: Release version derivation
        run: scripts/release.sh --selftest

      - name: Version agrees everywhere it is written
        run: |
          v=$(jq -r .version package.json)
          for spec in '.claude-plugin/plugin.json:.version' \
                      '.claude-plugin/marketplace.json:.metadata.version' \
                      '.claude-plugin/marketplace.json:.plugins[0].version' \
                      'package-lock.json:.version' \
                      'package-lock.json:.packages[""].version'; do
            f=${spec%%:*}; q=${spec#*:}
            got=$(jq -r "$q" "$f")
            echo "$f $q = $got"
            [ "$got" = "$v" ] || {
              echo "::error file=$f::version drift — $q is $got, package.json is $v. Use scripts/release.sh."
              exit 1; }
          done
          echo "every version field agrees on $v"
