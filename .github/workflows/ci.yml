name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor `engines` promises (node:sqlite); 24 is what people actually run.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check every shell hook and script
        run: for f in hooks/*.sh hooks/lib/*.sh scripts/*.sh; do bash -n "$f"; done


      # A synthetic vault, never a real one. memory-semantic's self-test asserts against real
      # notes on purpose and hard-fails when it finds none — an empty run must not read as a pass.
      - name: Build a synthetic vault
        run: node scripts/memory-synth-vault.mjs --out "$RUNNER_TEMP/vault" --notes 60 --seed 7

      # Discovery, not a list: `node --test` finds every *.test.mjs, so a new test file cannot be
      # forgotten here. That list used to be nine hand-maintained lines.
      #
      # --test-concurrency=1 on purpose. The suites share $CLAUDE_MEMORY_HOME (the project-key cache)
      # and the per-model index, and paths.test.mjs asserts that two git writes land in the SAME
      # SECOND. Running files in parallel makes both of those racy, and the failure mode is a test
      # that passes for the wrong reason. Revisit only with a per-file CLAUDE_MEMORY_HOME.
      - name: Tests
        env:
          CLAUDE_VAULT: ${{ runner.temp }}/vault
          CLAUDE_MEMORY_HOME: ${{ runner.temp }}/memory-home
        run: node --test --test-concurrency=1

      # Every top-level hook/script must be a thin entry over a lib/ module. Importing one must be
      # side-effect free, or a test file that imports it runs the hook: reading stdin, spawning a
      # headless `claude`, writing notes. That was a real bug three times.
      - name: lib/ modules import without side effects
        env:
          CLAUDE_VAULT: ${{ runner.temp }}/vault
          CLAUDE_MEMORY_HOME: ${{ runner.temp }}/memory-home
        run: |
          for f in hooks/lib/*.mjs scripts/lib/*.mjs; do
            case "$f" in *.test.mjs) continue ;; esac
            # --disable-warning: Node's OWN warnings are version-dependent (node:sqlite is
            # experimental on 22, stable on 24), and this check is about OUR output, not Node's.
            out=$(node --disable-warning=ExperimentalWarning --input-type=module -e "await import('./$f')" 2>&1)
            if [ -n "$out" ]; then
              echo "::error file=$f::importing this module produced output — it is not side-effect free:"
              echo "$out"
              exit 1
            fi
          done
          echo "all lib/ modules import cleanly"

      # The gate above runs with a VALID model, and that is exactly how a regression got through on
      # 2026-08-19: hooks/lib/memory-recall.mjs had imported scripts/lib/memory-semantic.mjs, whose
      # module scope does `console.log` + `process.exit(1)` on an unknown MEMORY_SEMANTIC_MODEL. The
      # hook entry imports its lib STATICALLY, above the fail-open try and above the arming gate, so
      # a typo'd model in config.json wrote that line to the hook's STDOUT on every prompt — and
      # hooks.json's trailing `|| exit 0` keeps the line while hiding the exit code. Claude Code
      # injects hook stdout as context, so this is a content bug, not just noise.
      #
      # hooks/lib ONLY. scripts/lib/memory-semantic.mjs exiting on an unknown model is correct CLI
      # behaviour and must keep working; what must never happen is that behaviour being reachable
      # from a hook's import graph.
      - name: hooks/lib modules import cleanly under a bad config too
        env:
          CLAUDE_VAULT: ${{ runner.temp }}/vault
          CLAUDE_MEMORY_HOME: ${{ runner.temp }}/memory-home
          MEMORY_SEMANTIC_MODEL: not-a-real-model
        run: |
          for f in hooks/lib/*.mjs; do
            case "$f" in *.test.mjs) continue ;; esac
            # `rc=$?` on its own line is unreachable here: GitHub runs `run:` under `bash -e`, so a
            # failing command substitution kills the step at the assignment and the ::error:: below
            # never prints — the build fails correctly but says nothing. Capture rc on the SAME
            # statement so the annotation survives (2026-08-19, found reviewing #29).
            rc=0
            out=$(node --disable-warning=ExperimentalWarning --input-type=module -e "await import('./$f')" 2>&1) || rc=$?
            if [ -n "$out" ] || [ "$rc" -ne 0 ]; then
              echo "::error file=$f::importing this module under an unknown model exited $rc or produced output —"
              echo "::error file=$f::a hook imports its lib ABOVE the fail-open try, so this reaches the prompt path:"
              echo "$out"
              exit 1
            fi
          done
          echo "all hooks/lib modules import cleanly under a bad model"

      # A top-level `node:test` import prints the whole test report to STDOUT even outside the
      # runner, and Claude Code reads hook stdout. It belongs only in *.test.mjs.
      - name: node:test is imported only by test files
        run: |
          bad=$(grep -rln "from 'node:test'" --include='*.mjs' hooks scripts | grep -v '\.test\.mjs$' || true)
          if [ -n "$bad" ]; then
            echo "::error::node:test imported outside a test file: $bad"
            exit 1
          fi
          echo "node:test confined to test files"

      # `## [Unreleased]` becomes the release notes VERBATIM, and .prettierignore excludes *.md, so
      # nothing else looks at its whitespace. A stray double blank line was caught by review twice
      # in one day (#43, #44) before this existed. Scoped to that section on purpose: an already
      # released section carries one, and rewriting shipped notes for whitespace is churn.
      - name: no double blank line in the [Unreleased] changelog section
        run: |
          bad=$(awk '
            /^## \[/ { inside = ($0 ~ /^## \[Unreleased\]/) }
            inside && prev == "" && $0 == "" { print NR }
            inside { prev = $0 }
          ' CHANGELOG.md)
          if [ -n "$bad" ]; then
            echo "::error file=CHANGELOG.md::double blank line in [Unreleased] at line(s): $bad"
            echo "that section ships as the release notes verbatim; prettier does not format *.md"
            exit 1
          fi
          echo "[Unreleased] spacing is single-blank throughout"

      # node:sqlite belongs to the entry points, which own the handle. A lib/ module that opens a
      # database is not testable without one, and the side-effect check above cannot catch this:
      # it suppresses ExperimentalWarning precisely because node:sqlite emits one, so an import
      # would pass silently. This check is what the comment in lib/memory-semantic.mjs claims
      # exists — it did not until 2026-08-18, and a claimed-but-absent guard is worse than none.
      - name: node:sqlite is imported only by entry points
        run: |
          # Matches the IMPORT, not the string: both lib files mention node:sqlite in prose, and a
          # bare `grep node:sqlite` fails the build on its own comments.
          bad=$(grep -rlnE "from 'node:sqlite'|import\('node:sqlite'\)|require\('node:sqlite'\)" \
            --include='*.mjs' hooks/lib scripts/lib || true)
          if [ -n "$bad" ]; then
            echo "::error::node:sqlite imported inside lib/: $bad"
            echo "the entry owns the handle; lib/ takes rows as values so it can be tested"
            exit 1
          fi
          echo "node:sqlite confined to entry points"

      # The entry/lib split is this repo's central structural claim — hooks/hooks.json and
      # commands/*.md name the ENTRY paths, so those filenames are a contract and the logic belongs
      # in the lib/ twin, where it can be imported and tested without running the hook. Nothing
      # enforced it until 2026-08-19: docs/architecture.md's invariants table said "nothing" in the
      # enforced-by column, and the allowlist only got small enough to be honest once the last
      # untwinned entries were ported.
      #
      # EXISTENCE ONLY, and that limit is the point: memory-semantic.mjs, memory-eval.mjs and
      # memory-audit-checks.mjs all have twins and still carry the real logic in the entry. A green
      # check here is not evidence that entries are thin — do not later read it as one.
      #
      # *.test.mjs is not an entry: hooks/vault-memory-sync.test.mjs tests a SHELL hook, and a naive
      # glob would demand a lib/ twin for a test file.
      - name: Every entry has a lib/ twin
        run: |
          rc=0; n=0
          for f in hooks/*.mjs scripts/*.mjs; do
            case "$f" in *.test.mjs) continue ;; esac
            n=$((n + 1))
            d=${f%/*}; b=${f##*/}
            if [ -f "$d/lib/$b" ]; then continue; fi
            case "$f" in
              # env.mjs renders what paths.mjs resolves, so its logic lives in
              # hooks/lib/env-shell.mjs beside paths.mjs. A scripts/lib/env.mjs would file
              # hook-resolution infra under scripts/, split from the module it exists to serve.
              scripts/env.mjs) continue ;;
              # log-worker.mjs is not an entry: nothing in hooks.json points at it. It is the
              # supervisor detach() puts in front of background work so the worker gets a log line,
              # and it is 20 lines of spawn-wait-log. A lib/ twin would be a module whose only
              # caller is a file shorter than it.
              hooks/log-worker.mjs) continue ;;
            esac
            echo "::error file=$f::no lib/ twin — move the logic into $d/lib/$b and leave argv/stdin/stdout in the entry, or allowlist $f in this step with a stated reason"
            rc=1
          done
          # 16 entries on 2026-08-19. A glob that stops matching would pass this step by checking
          # nothing, which two steps in this file have already shipped doing.
          [ "$n" -ge 14 ] || { echo "::error::found only $n entries — the glob broke"; exit 1; }
          [ "$rc" = 0 ] || exit 1
          echo "$n entries, each with a lib/ twin or an allowlisted reason"

      # `node --test` is discovery-based and CI only ever sees TRACKED files, so a commit that
      # forgets a new file is fully green on a repo that is broken: on 2026-08-19 the prune-logs
      # port had `git rm scripts/prune-logs.sh` staged while the .mjs entry, its lib/ twin and both
      # test files were still untracked — `/memory:prune` step 1 would have invoked a file that did
      # not exist, and both new test files would have vanished from the run — a lower total, and
      # nothing red to say so.
      #
      # So: every path a command body or hooks.json names must be a tracked file, and so must
      # whatever that entry statically imports — an entry that is tracked while its lib/ twin is
      # not is the same failure one level down. git ls-files, not `test -e`: an untracked file is
      # present in the working tree and would pass an existence check locally.
      #
      # Not `s|...|`: GNU sed (this runner) reads `\|` inside an ERE s-command as a LITERAL
      # pipe, so the alternation became the string `MEM|CLAUDE_PLUGIN_ROOT`, nothing matched, no
      # prefix was stripped and all 15 refs failed `git ls-files`. BSD sed on a dev machine reads
      # it as alternation, so the check looked green here and would have been red on CI only
      # (2026-08-19). The delimiter is now `#`, which is not a regex metacharacter.
      - name: Every path a command or hook invokes is tracked
        run: |
          rc=0
          refs=$(grep -ohE '\$\{?(MEM|CLAUDE_PLUGIN_ROOT)\}?/[A-Za-z0-9._/-]+' \
            commands/*.md hooks/hooks.json \
            | sed -E 's#^\$\{?(MEM|CLAUDE_PLUGIN_ROOT)\}?/##' \
            | grep -v '^node_modules/' | sed 's/[.]$//' | sort -u)
          # A pattern that stops matching would pass this step by checking nothing.
          [ -n "$refs" ] || { echo "::error::extracted no plugin-root references — the pattern broke"; exit 1; }
          for p in $refs; do
            git ls-files --error-unmatch "$p" >/dev/null 2>&1 || {
              echo "::error::a command or hook invokes \$MEM/$p, which is not a tracked file"; rc=1; continue; }
            case "$p" in *.mjs) ;; *) continue ;; esac
            # `import x from './y'` and the side-effect form `import './y'` both count; a bare
            # `from '` pattern saw only the first (2026-08-19).
            for spec in $(grep -ohE "(from|import) '\.\.?/[A-Za-z0-9._/-]+'" "$p" | sed -E "s#(from|import) '##; s#'\$##"); do
              dep="$(dirname "$p")/$spec"
              git ls-files --error-unmatch "$dep" >/dev/null 2>&1 || {
                echo "::error file=$p::imports $spec, which is not a tracked file"; rc=1; }
            done
          done
          [ "$rc" = 0 ] || exit 1
          echo "every path a command or hook invokes is tracked"
      # There is no Python left. Fail if any creeps back in — the whole point of the port was
      # that a second runtime is a second thing to be the wrong version on someone's machine.
      # Matches real dependencies only (a .py file, or a shell hook shelling out to python),
      # not prose: the port's own comments explain why python went away.
      # No \b in the pattern: git grep -E is POSIX ERE, where \b is undefined — it matched
      # NOTHING rather than erroring, so this half of the check was dead on arrival and the
      # step still passed. Verified against a planted .py and a planted .sh; both are caught.

      - name: No Python dependency
        run: |
          bad=$( { git ls-files '*.py'; git grep -l python -- '*.sh'; } | sort -u )
          if [ -n "$bad" ]; then
            echo "::error::a Python dependency reappeared in: $bad"; exit 1
          fi
          echo "no python dependency"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Its own job, not a matrix step: formatting does not depend on the Node version, and the same
      # mistake already cost `release.sh --selftest` two runs per push.
      #
      # Pinned, and via npx rather than a devDependency. Claude Code auto-runs `npm ci` on plugin
      # install, which installs devDependencies, so a prettier devDependency would ship into every
      # user's version-pinned plugin cache (already 381 MB) to format code they will never edit.
      - name: Formatting
        run: npx --yes prettier@3.6.2 --check .

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pure bash, so it lives here rather than in the Node matrix, where it would run twice for
      # no reason. The release version is derived from commit shape; a wrong branch ships a wrong
      # number, and nothing downstream would notice.
      - name: Release version derivation
        run: scripts/release.sh --selftest

      - name: Version agrees everywhere it is written
        run: |
          v=$(jq -r .version package.json)
          for spec in '.claude-plugin/plugin.json:.version' \
                      '.claude-plugin/marketplace.json:.metadata.version' \
                      '.claude-plugin/marketplace.json:.plugins[0].version' \
                      'package-lock.json:.version' \
                      'package-lock.json:.packages[""].version'; do
            f=${spec%%:*}; q=${spec#*:}
            got=$(jq -r "$q" "$f")
            echo "$f $q = $got"
            [ "$got" = "$v" ] || {
              echo "::error file=$f::version drift — $q is $got, package.json is $v. Use scripts/release.sh."
              exit 1; }
          done
          echo "every version field agrees on $v"

  # The only check that runs a real `npm ci`. Everything else mocks the embedding runtime, so
  # nothing else would notice if an upstream layout change quietly restored the 320 MB that
  # scripts/slim-install.mjs strips — it fails safe, which means it fails silently.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install is slim
        run: |
          npm ci
          mb=$(du -sm node_modules | cut -f1)
          echo "node_modules: ${mb} MB"
          # Printed always, so a failure here says what grew instead of just how much.
          du -sm node_modules/* node_modules/*/* 2>/dev/null | sort -rn | head -8
          # ~55 MB slimmed on linux/x64, 380 MB unslimmed. Anything near the ceiling means the
          # postinstall stopped matching what it deletes.
          [ "$mb" -lt 100 ] || { echo "::error::node_modules is ${mb} MB — slim-install did not apply"; exit 1; }
          for p in sharp onnxruntime-web; do
            v=$(node -p "require('./node_modules/$p/package.json').version")
            [ "$v" = "0.0.0-stub" ] || { echo "::error::$p is $v, not the stub"; exit 1; }
          done

      # sharp and onnxruntime-web are STATIC imports in transformers.node.mjs — a stub with the
      # wrong shape fails here, at module load, before any model is involved. Deliberately not
      # a real embedding: that would pull 722 MB of weights into CI for a check this covers.
      - name: transformers still loads against the stubs
        run: node --input-type=module -e "await import('@huggingface/transformers'); console.log('loaded')"

      # Lives in this job, not `test`, because it is the only one that runs a real `npm ci`:
      # @types/node arrives transitively with @huggingface/transformers and is what makes
      # `import fs from 'node:fs'` check at all. If that dependency ever stops carrying it, every
      # file fails here at once rather than silently checking against nothing.
      #
      # tsc is pinned and run through npx for the same reason Prettier is: `npm ci` on plugin
      # install would ship a devDependency into every user's version-pinned cache. The version lives
      # in package.json's scripts and nowhere else — unlike prettier, which this file also names.
      - name: Types check
        run: npm run typecheck

      # A check that passes by checking nothing has shipped here twice, which is why the steps
      # above count what they found. tsconfig.json's include globs are the same hazard: a .mjs
      # added at the root, or under a new top-level directory, would be checked by nobody and CI
      # would stay green. Compare against git rather than a hardcoded number, so adding a file is
      # not a CI edit.
      - name: The type check covers every tracked .mjs
        run: |
          npm run typecheck --silent -- --listFiles > /tmp/listed.txt
          grep -v '/node_modules/' /tmp/listed.txt | sed "s#^$PWD/##" | grep -E '[.]mjs$' | sort -u > /tmp/checked.txt
          git ls-files '*.mjs' | sort -u > /tmp/tracked.txt
          missing=$(comm -13 /tmp/checked.txt /tmp/tracked.txt)
          if [ -n "$missing" ]; then
            echo "::error::tracked .mjs files that tsconfig.json does not check:"
            echo "$missing"
            exit 1
          fi
          echo "$(wc -l < /tmp/tracked.txt) tracked .mjs files, all type-checked"
